<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Comps</title>
    <meta
      name="description"
      content="Build and track your Uma Musume Champions Meeting and League of Heroes teams: Umas, parents, deck, placement and WR."
    />
    <meta name="theme-color" content="#11131b" />

    <!-- Prévia do link (Discord, WhatsApp, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Comps" />
    <meta property="og:title" content="Comps" />
    <meta
      property="og:description"
      content="Build and track your Uma Musume Champions Meeting and League of Heroes teams."
    />
    <meta property="og:url" content="https://kaiooleo.github.io/CMcomps/" />
    <meta
      property="og:image"
      content="https://kaiooleo.github.io/CMcomps/og.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Ícones e instalação como app -->
    <link rel="icon" href="icons/favicon.png" type="image/png" />
    <link
      rel="icon"
      href="icons/icon-192.png"
      type="image/png"
      sizes="192x192"
    />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />

    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Figtree:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <header>
      <div class="wrap hrow">
        <span class="backslot"
          ><button
            class="back"
            id="back"
            type="button"
            aria-label="Back"
            title="Back"
            hidden
          >
            ←
          </button></span
        >
        <div class="brand">
          <img
            src="icons/cheval-chibi.webp"
            alt=""
            width="40"
            height="40"
          />Comps
        </div>
        <nav>
          <a href="#resumo" id="nav-resumo">Summary</a
          ><a href="#cms" id="nav-cms">PvP</a>
        </nav>
        <label class="me"
          >Name<input
            id="me-name"
            type="text"
            maxlength="30"
            autocomplete="nickname"
            placeholder="Your name"
        /></label>
        <span class="me" id="me-show" hidden
          ><b id="me-text"></b
          ><button class="btn sm" type="button" id="me-edit">
            Change
          </button></span
        >
        <div class="status" id="status" aria-live="polite"></div>
      </div>
    </header>
    <main class="wrap" id="app"></main>
    <footer class="wrap foot">
      <p>
        Your teams are saved <b>in this browser</b>. To move them to another
        device or keep them safe if you clear the browser, save a backup.
      </p>
      <div class="confirm">
        <button class="btn" type="button" id="bk-down">Save backup</button
        ><label class="btn" for="bk-file" style="cursor: pointer"
          >Load backup</label
        ><input
          type="file"
          id="bk-file"
          accept=".json,application/json"
          hidden
        />
      </div>
    </footer>

    <dialog id="picker" aria-labelledby="pk-title">
      <div class="dhead">
        <h2 id="pk-title">Choose</h2>
        <input
          class="search"
          id="pk-q"
          type="search"
          placeholder="Search by name"
          autocomplete="off"
        />
        <button class="btn danger" id="pk-remove" type="button">Remove</button>
        <button class="btn" id="pk-close" type="button" aria-label="Close">
          ✕
        </button>
      </div>
      <div class="dfil" id="pk-fil"></div>
      <div class="pick" id="pk-list"></div>
    </dialog>

    <script src="data.js"></script>
    <script src="affinity.js"></script>
    <script src="logic.js"></script>
    <script src="app.js"></script>
  </body>
</html>
