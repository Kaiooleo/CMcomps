<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>CM Comps</title>
    <link rel="stylesheet" href="style.css" />
    <meta name="claude:viewport-fit-sides" content="cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Figtree:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <header>
      <div class="wrap hrow">
        <span class="backslot"
          ><button
            class="back"
            id="back"
            type="button"
            aria-label="Voltar"
            title="Voltar"
            hidden
          >
            ←
          </button></span
        >
        <div class="brand"><i aria-hidden="true"></i>CM Comps</div>
        <nav>
          <a href="#resumo" id="nav-resumo">Resumo</a
          ><a href="#cms" id="nav-cms">PvP</a>
        </nav>
        <div class="status" id="status">Carregando…</div>
      </div>
    </header>
    <main class="wrap" id="app"></main>
    <footer class="wrap foot">
      <p>
        Seus times ficam salvos <b>neste navegador</b>. Para levar para outro
        aparelho ou não perder nada ao limpar o navegador, baixe um backup.
      </p>
      <div class="confirm">
        <button class="btn" type="button" id="bk-down">Baixar backup</button
        ><label class="btn" for="bk-file" style="cursor: pointer"
          >Carregar backup</label
        ><input
          type="file"
          id="bk-file"
          accept=".json,application/json"
          hidden
        />
      </div>
    </footer>

    <dialog id="picker" aria-labelledby="pk-title">
      <div class="dhead">
        <h2 id="pk-title">Escolher</h2>
        <input
          class="search"
          id="pk-q"
          type="search"
          placeholder="Buscar pelo nome"
          autocomplete="off"
        />
        <button class="btn danger" id="pk-remove" type="button">Remover</button>
        <button class="btn" id="pk-close" type="button" aria-label="Fechar">
          ✕
        </button>
      </div>
      <div class="dfil" id="pk-fil"></div>
      <div class="pick" id="pk-list"></div>
    </dialog>

    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
