<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}.foot{padding-block:8px 40px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}.foot p{margin:0;flex:1 1 280px}</style>
<title>CM Comps</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky header + tabs. Resumo = performance strip, score-by-CM chart, aces/styles, card podiums.
   CMs = tile grid; tile opens detail (result strip + three compact runner cards: info on top, parent triangle beside 2x3 deck). */
:root{
  --bg:#f3f6f1; --surface:#ffffff; --surface-2:#eaf0e7; --line:#d6ded1;
  --fg:#1d2420; --muted:#5d6b62; --faint:#8c998f; --accent:#23864f; --accent-soft:#d6ecdd; --accent-ink:#ffffff;
  --pink:#d63f86; --pink-soft:#fbe1ee; --loh:#c9302c; --gold:#b98a12; --silver:#7b8794; --bronze:#a8643a; --b1:#3f6fd1;
  --t-speed:#2f7fe0; --t-stamina:#e0523f; --t-power:#d89a12; --t-guts:#e0609c; --t-wit:#2fa36b; --t-pal:#e07a2f; --t-group:#8a63d2;
  --f-display:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Arial Rounded MT Bold",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111613; --surface:#1a211d; --surface-2:#232c26; --line:#313c35;
  --fg:#e6ece7; --muted:#9aa89f; --faint:#6f7d74; --accent:#4cc283; --accent-soft:#1f3a2a; --accent-ink:#0d1a12;
  --pink:#f070ab; --pink-soft:#3a1f2c; --loh:#f0625e; --gold:#e2b843; --silver:#aab4bf; --bronze:#d58a5c; --b1:#7da0f0;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#1a211d; --surface-2:#232c26; --line:#313c35;
  --fg:#e6ece7; --muted:#9aa89f; --faint:#6f7d74; --accent:#4cc283; --accent-soft:#1f3a2a; --accent-ink:#0d1a12;
  --pink:#f070ab; --pink-soft:#3a1f2c; --loh:#f0625e; --gold:#e2b843; --silver:#aab4bf; --bronze:#d58a5c; --b1:#7da0f0;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:20px;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--accent) 0 75%,var(--pink) 75% 100%)}
nav{display:flex;gap:4px}
nav a{padding:6px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600}
nav a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.status{margin-left:auto;font-size:13px;color:var(--muted)}
.status.err{color:var(--loh)}
main{padding-block:20px 48px;display:grid;gap:20px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h1{font-size:26px} h2{font-size:17px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.banner{background:var(--surface-2);border-radius:var(--r);padding:14px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner p{margin:0;flex:1 1 260px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600}
a.btn{text-decoration:none;color:var(--fg);display:inline-block}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--loh)}
.btn:disabled{opacity:.5;cursor:default}
.num{font-variant-numeric:tabular-nums}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pl-1st{background:var(--gold);color:#fff}.pl-2nd{background:var(--silver);color:#fff}.pl-3rd{background:var(--bronze);color:#fff}.pl-B1st{background:var(--b1);color:#fff}
.cmid{font-family:var(--f-display);font-weight:800}
.cmid.loh{color:var(--loh)}
.search{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;min-width:0;flex:1 1 200px;max-width:320px}
.ph{display:grid;place-items:center;min-width:0;overflow-wrap:anywhere;border-radius:8px;background:var(--surface-2);color:var(--muted);font-family:var(--f-display);font-weight:800;font-size:11px;overflow:hidden;text-align:center;line-height:1.1;padding:2px}
.empty{color:var(--muted);padding:16px 0;text-align:center;grid-column:1/-1;margin:0}

/* ---------- resumo ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:16px}
.perf{display:grid;gap:14px;align-content:start}
.wr{display:flex;align-items:baseline;gap:10px}
.wr b{font-family:var(--f-display);font-size:52px;line-height:1;font-weight:800;letter-spacing:-.02em}
.wr span{color:var(--muted)}
.medals{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.medal{display:grid;gap:2px;justify-items:center;padding:10px 4px;border-radius:10px;background:var(--surface-2)}
.medal b{font-family:var(--f-display);font-size:22px;line-height:1}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--line);padding-top:12px}
.facts div{display:grid;gap:2px}
.facts b{font-family:var(--f-display);font-size:20px}
.facts a{font-size:12px;text-decoration:none}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12px;padding:5px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-100%);margin-top:-8px}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.row2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
.aces{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:12px;margin-top:12px}
.ace{display:grid;justify-items:center;gap:4px;text-align:center;font-size:12px;line-height:1.2}
.ace .av{position:relative;width:80px;height:80px}
.ace .av :is(img,.spr),.ace .av .ph{width:80px;height:80px;border-radius:12px;object-fit:cover;background-color:var(--surface-2)}
.ace .av b{position:absolute;right:-4px;bottom:-2px;background:var(--accent);color:var(--accent-ink);font-size:11px;border-radius:999px;padding:1px 7px;border:2px solid var(--surface)}
.bars{display:grid;gap:10px;margin-top:12px}
.bar{display:grid;grid-template-columns:96px 1fr 24px;gap:8px;align-items:center;font-size:13px}
.bar .t{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--accent);border-radius:4px}
.podium{display:grid;grid-template-columns:repeat(5,minmax(0,150px));gap:10px;margin-top:12px}
.pc{display:grid;gap:6px;min-width:0}
.pc .art{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--surface-2)}
.pc .art :is(img,.spr),.pc .art .ph{width:100%;height:100%;object-fit:cover;border-radius:0}
.pc .rk{position:absolute;left:6px;top:6px;background:var(--surface);color:var(--fg);font-family:var(--f-display);font-weight:800;font-size:12px;border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center}
.pc .ct{position:absolute;right:6px;bottom:6px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:12px;border-radius:999px;padding:1px 8px}
.pc.borrow .ct{background:var(--pink);color:#fff}
.pc .nm{font-size:12px;line-height:1.2;font-weight:600}
.pc .nm small{display:block;color:var(--muted);font-weight:400}

/* ---------- lista de CMs ---------- */
.lhead{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.lhead h1{flex:1 1 auto}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.tog{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;color:var(--muted)}
.tog[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:transparent}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.tile{display:grid;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-decoration:none;color:var(--fg)}
.tile:hover{border-color:var(--accent)}
.tile .top{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap}
.tile .top h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tile .top h2{flex:1 1 auto;font-size:18px}
.tile .top h2 .sc{color:var(--muted);font-weight:700}
.tile .ln{color:var(--muted);font-size:14px}
.tile .faces{display:flex;gap:8px;min-height:52px;margin-top:4px}
.tile .face{width:52px;height:52px;border-radius:10px;overflow:hidden;background:var(--surface-2);box-shadow:0 0 0 2px var(--surface-2);flex:none}
.tile .face.debuff{box-shadow:0 0 0 2.5px var(--loh)}
.tile .face :is(img,.spr),.tile .face .ph{width:100%;height:100%;object-fit:cover;font-size:10px;border-radius:0}
.cond{color:var(--faint);font-size:13px}
.chip.cur{background:var(--accent);color:var(--accent-ink)}
.tile.current{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tile.future{opacity:.62}
.tile.future:hover{opacity:1}
.banner.sched{background:var(--accent-soft)}
.chip.none{background:transparent;border:1px solid var(--line);color:var(--faint)}

/* ---------- detalhe ---------- */
.cmhead{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
.cmhead .meta{display:flex;gap:8px;flex-wrap:wrap}
.nav2{display:flex;gap:8px;margin-left:auto}
.result{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:16px}
.places{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.places button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:700}
.places button[aria-pressed="true"].p-1st{background:var(--gold);color:#fff;border-color:transparent}
.places button[aria-pressed="true"].p-2nd{background:var(--silver);color:#fff;border-color:transparent}
.places button[aria-pressed="true"].p-3rd{background:var(--bronze);color:#fff;border-color:transparent}
.places button[aria-pressed="true"].p-B1st{background:var(--b1);color:#fff;border-color:transparent}
.places button[aria-pressed="true"].p-none{background:var(--surface-2)}
.rats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:8px}
.rats input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 8px;text-align:center;font-variant-numeric:tabular-nums}
.rats input.bad{border-color:var(--loh)}
.score{display:flex;align-items:baseline;gap:8px;margin-top:10px}
.score b{font-family:var(--f-display);font-size:28px}
.team{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.runner{display:grid;gap:14px;align-content:start}
.runner.debuff{background:var(--surface-2)}
.runner.debuff .slot.filled{background:var(--surface)}
.rtop{display:grid;grid-template-columns:88px minmax(0,1fr);gap:12px;align-items:start}
.slot{border:1.5px dashed var(--line);border-radius:10px;background:transparent;padding:0;display:grid;place-items:center;color:var(--faint);overflow:hidden;position:relative;font-size:10px;font-weight:700}
.slot:hover:not(:disabled){border-color:var(--accent)}
.slot.filled{border-style:solid;border-color:transparent;background:var(--surface-2)}
.slot :is(img,.spr){width:100%;height:100%;object-fit:cover;display:block}
.slot .ph{width:100%;height:100%;border-radius:0;font-size:9px}
.slot.main{width:88px;height:88px}
.slot.main .plus{font-size:22px;font-weight:300}
.rname{font-family:var(--f-display);font-weight:800;font-size:16px;line-height:1.2;background:none;border:0;padding:0;text-align:left}
.fields{display:grid;gap:6px;margin-top:6px}
.fields label{display:grid;grid-template-columns:52px minmax(0,1fr);gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.fields select,.fields input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 6px;min-width:0;width:100%;font-size:13px}
.wins{display:flex;align-items:center;gap:6px}
.wins input{width:64px}
.lower{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:12px;align-items:start;border-top:1px solid var(--line);padding-top:12px}
.lower .label{margin-bottom:8px}
/* triângulo de pais: ápice = a própria Uma, depois P1/P2, depois os 4 avós */
.tree{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 4px;justify-items:center;position:relative}
.tree .apex{grid-column:2/span 2;width:40%;min-width:30px;aspect-ratio:1;border-radius:50%;overflow:hidden;background:var(--surface-2);display:grid;place-items:center}
.tree .apex :is(img,.spr),.tree .apex .ph{width:100%;height:100%;object-fit:cover;border-radius:50%}
.tree .par{grid-column:span 2;width:54%}
.tree .gp{width:100%}
.tree .slot{aspect-ratio:1;border-radius:50%}
.tree .slot.filled{box-shadow:0 0 0 2px var(--surface)}
.tree .par.slot.filled{box-shadow:0 0 0 2px var(--accent-soft)}
.deck{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.deck .slot{aspect-ratio:3/4;width:100%;border-radius:7px}
.deck .slot.borrow{border:2px dashed var(--pink);background:var(--pink-soft);color:var(--pink)}
.deck .slot.borrow.filled{border:2.5px solid var(--pink);box-shadow:0 0 0 3px var(--pink-soft)}
.deck .slot.borrow .tag{position:absolute;left:0;right:0;bottom:0;background:var(--pink);color:#fff;font-size:8px;letter-spacing:.06em;padding:2px 0;text-align:center}
.debuff .lower{opacity:.85}

/* ---------- seletor ---------- */
dialog{border:0;border-radius:16px;padding:0;background:var(--surface);color:var(--fg);width:min(920px,calc(100vw - 24px));max-height:calc(100dvh - 48px);display:none;box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog[open]{display:grid;grid-template-rows:auto auto minmax(0,1fr)}
dialog::backdrop{background:rgba(10,16,12,.55)}
.dhead{display:flex;gap:10px;align-items:center;padding:14px 16px 8px;flex-wrap:wrap}
.dhead h2{flex:1 1 auto}
.dfil{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 10px;border-bottom:1px solid var(--line)}
.pick{overflow-y:auto;padding:12px 16px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;align-content:start}
.pick button{min-width:0;border:1px solid transparent;background:none;border-radius:10px;padding:4px;display:grid;gap:4px;text-align:center;font-size:12px;line-height:1.2;align-content:start}
.pick button:hover{border-color:var(--accent);background:var(--surface-2)}
.pick .im{width:100%;aspect-ratio:1;border-radius:8px;overflow:hidden}
.pick.cards .im{aspect-ratio:3/4}
.pick .im :is(img,.spr){width:100%;height:100%;object-fit:cover}
.pick .im .ph{width:100%;height:100%}
.pick small{color:var(--muted)}
.ty{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}

@media (max-width:960px){.team{grid-template-columns:1fr;max-width:520px}.result,.hero,.row2{grid-template-columns:1fr}}
@media (max-width:560px){.podium{gap:6px}.pc .nm small{display:none}.rats{grid-template-columns:repeat(2,1fr)}.status{width:100%;margin-left:0}.wr b{font-size:42px}}
@media (prefers-reduced-motion:no-preference){.slot,.pick button,.tile{transition:border-color .15s,background .15s}}

.spr{display:block;width:100%;height:100%;background-repeat:no-repeat}
.backslot{width:32px;height:32px;flex:none;display:grid;place-items:center}
.back{width:32px;height:32px;border:1px solid var(--line);background:var(--surface);border-radius:50%;padding:0;font-size:16px;font-weight:700;line-height:1;display:grid;place-items:center}
.back[hidden]{display:none}
.back:hover{border-color:var(--accent);color:var(--accent)}
.fields label.nolab{grid-template-columns:minmax(0,1fr)}
.curhero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:16px 24px;align-items:center;background:var(--accent-soft);border:1.5px solid var(--accent);border-radius:var(--r);padding:20px}
.ch-main{display:grid;gap:6px;text-decoration:none;color:var(--fg)}
.ch-main h1{font-size:32px}
.ch-main .sc{color:var(--muted);font-weight:700}
.ch-main .ln{color:var(--muted)}
.ch-main .note{margin:0;font-size:13px;color:var(--muted)}
.ch-team{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ch-team .ct{display:grid;justify-items:center;gap:2px;text-align:center;text-decoration:none;color:var(--fg);font-size:13px;line-height:1.2}
.ch-team .ct .av{width:100%;max-width:120px;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--surface);margin-bottom:4px}
.ch-team .ct small{color:var(--muted)}
.ch-team .ct.debuff{opacity:.75}
.ch-next{grid-column:1/-1}
@media (max-width:760px){.curhero{grid-template-columns:1fr}}
</style>

</head>
<body>
<header><div class="wrap hrow">
  <span class="backslot"><button class="back" id="back" type="button" aria-label="Voltar" title="Voltar" hidden>←</button></span><div class="brand"><i aria-hidden="true"></i>CM Comps</div>
  <nav><a href="#resumo" id="nav-resumo">Resumo</a><a href="#cms" id="nav-cms">PvP</a></nav>
  <div class="status" id="status">Carregando…</div>
</div></header>
<main class="wrap" id="app"></main>
<footer class="wrap foot">
  <p>Seus times ficam salvos <b>neste navegador</b>. Para levar para outro aparelho ou não perder nada ao limpar o navegador, baixe um backup.</p>
  <div class="confirm"><button class="btn" type="button" id="bk-down">Baixar backup</button><label class="btn" for="bk-file" style="cursor:pointer">Carregar backup</label><input type="file" id="bk-file" accept=".json,application/json" hidden></div>
</footer>

<dialog id="picker" aria-labelledby="pk-title">
  <div class="dhead">
    <h2 id="pk-title">Escolher</h2>
    <input class="search" id="pk-q" type="search" placeholder="Buscar pelo nome" autocomplete="off">
    <button class="btn danger" id="pk-remove" type="button">Remover</button>
    <button class="btn" id="pk-close" type="button" aria-label="Fechar">✕</button>
  </div>
  <div class="dfil" id="pk-fil"></div>
  <div class="pick" id="pk-list"></div>
</dialog>

<script>
(()=>{
const CAT=JSON.parse(document.getElementById('catalog').textContent);
const ATLAS=JSON.parse(document.getElementById('imgs').textContent);
const IMGS={has:f=>!!(f&&ATLAS[f])};
function spr(f,alt){const [u,c,r,C,R]=ATLAS[f];return `<span class="spr" role="img" aria-label="${esc(alt)}" style="background-image:url(${u});background-size:${C*100}% ${R*100}%;background-position:${C>1?c/(C-1)*100:0}% ${R>1?r/(R-1)*100:0}%"></span>`;}
const CHAR=new Map(CAT.chars.map(c=>[c.n,c]));
const CARD=new Map(CAT.cards.map(c=>[c.k,c]));
const STYLES=['Runaway','Front Runner','Pace Chaser','Late Surger','End Closer'];
const ROLES=['Ace','Debuffer'];
const PLACES=['1st','2nd','3rd','B 1st'];
const TYPES=['Speed','Stamina','Power','Guts','Wit','Pal','Group'];
const PAR=['P1','GP1.1','GP1.2','P2','GP2.1','GP2.2'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dist=m=>!m?'':m<=1400?'Sprint':m<=1999?'Mile':m<=2400?'Medium':'Long';
const plClass=p=>p?'pl-'+p.replace(' ',''):'';
const typeVar=t=>'var(--t-'+(t||'').toLowerCase()+',var(--muted))';

/* ---------- estado ---------- */
let DATA={};
/* ---------- CM atual (configuração do dono, vale para todos) ---------- */
let CONF={cur:null,date:null};
const cmIdx=id=>CAT.cms.findIndex(c=>c.id===id);
const cond=c=>[c.se,c.we,c.gr].filter(Boolean).map(esc).join(' · ');
const fmtDate=d=>d?d.split('-').reverse().join('/'):'';
// data vazia = sem data; ano fora de 2020–2100 = inválida (evita salvar enquanto digita)
function okDate(v){ if(!v) return null; const y=+v.slice(0,4); if(y<2020||y>2100){ status('Data inválida: confira o ano (ex.: 05/11/2026).',true); return false; } return v; }
function finalPassed(){ if(!CONF.date||+CONF.date.slice(0,4)<2020) return false; return new Date()>new Date(CONF.date+'T23:59:59'); }
// 'past' conta; 'current' conta só depois da final; 'future' não conta
function phase(id){ if(!CONF.cur||cmIdx(CONF.cur)<0) return 'past'; const i=cmIdx(id),c=cmIdx(CONF.cur); return i<c?'past':i===c?'current':'future'; }
function counted(id){ const ph=phase(id); return ph==='past'||(ph==='current'&&finalPassed()); }
async function saveConf(next){
  const prev=CONF; CONF=next; route();
  try{ await db.doc('config/schedule').set(next); status('Current CM salvo'); }
  catch(e){ CONF=prev; route(); status('Não foi possível salvar o Current CM.',true); }
}
function scheduleBanner(){
  if(!CONF.cur||cmIdx(CONF.cur)<0) return owner&&db?`<div class="banner"><p>Todos os CMs entram nas estatísticas. Para não contar os times que você está planejando, marque o CM atual na página dele.</p></div>`:'';
  const i=cmIdx(CONF.cur), nx=CAT.cms[i+1], passed=finalPassed();

/* ---------- imagens ---------- */
function initials(name){return esc(String(name||'').replace(/\(.*?\)/g,'').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase())}
function charImg(name,big){
  if(!name) return '';
  const c=CHAR.get(name);
  const f=c&&(big&&IMGS.has(c.s)?c.s:IMGS.has(c.i)?c.i:IMGS.has(c.s)?c.s:null);
  return f?spr(f,name):`<span class="ph" title="${esc(name)}">${initials(name)}</span>`;
}
function cardImg(key){
  if(!key) return '';
  const c=CARD.get(key);
  if(c&&IMGS.has(c.im)) return spr(c.im,`${c.n} – ${c.t}`);
  const n=c?c.n:key.split('\n')[0];

/* ---------- cálculos ---------- */
function ratingScore(rat){
  let s=0,n=0;
  for(const r of rat||[]){ if(!r) continue; const nums=String(r).split('-').map(x=>parseInt(x,10)).filter(x=>!isNaN(x)); if(!nums.length) continue; s+=nums.reduce((a,b)=>a+b,0); n++; }
  return n?s/(n*20):0;
}
const pct=x=>(Math.round(x*1000)/10).toLocaleString('pt-BR')+'%';
function computeStats(){
  const pl={'1st':0,'2nd':0,'3rd':0,'B 1st':0}, styles={}, aces={}, cards={}, borrow={}; const scores=[];
  for(const cm of CAT.cms){
    const d=DATA[cm.id]; if(!d||!counted(cm.id)) continue;
    if(pl[d.pl]!==undefined) pl[d.pl]++;
    const sc=ratingScore(d.rat); if(sc>0) scores.push({id:cm.id,sc,pl:d.pl});
    for(const t of d.team){
      if(!t.n||t.ro==='Debuffer') continue;
      aces[t.n]=(aces[t.n]||0)+1;
      if(t.st) styles[t.st]=(styles[t.st]||0)+1;
      t.d.forEach((k,i)=>{ if(!k) return; const m=i===5?borrow:cards; m[k]=(m[k]||0)+1; });
    }
  }
  const tot=PLACES.reduce((a,p)=>a+pl[p],0);
  const top=(m,n)=>Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,n);
  const sorted=[...scores].sort((a,b)=>b.sc-a.sc);
  return {pl,tot,wr:tot?pl['1st']/tot:0,styles,aces:top(aces,10),cards:top(cards,5),borrow:top(borrow,5),scores,
    best:sorted[0],worst:sorted[sorted.length-1],avg:scores.length?scores.reduce((a,b)=>a+b.sc,0)/scores.length:0};
}

/* ---------- resumo ---------- */
function scoreChart(scores,avg){
  if(!scores.length) return '<p class="empty">O WR aparece aqui quando você preencher as rodadas de um CM.</p>';
  const W=640,H=200,L=34,R=8,T=12,B=28, n=scores.length, bw=(W-L-R)/n, y=v=>T+(1-v)*(H-T-B);
  const ticks=[0,.25,.5,.75,1];
  const every=Math.max(1,Math.ceil(n/12));
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="WR by PvP">`;
  s+=ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(t)+3}" text-anchor="end">${t*100}%</text>`).join('');
  scores.forEach((d,i)=>{
    const x=L+i*bw, w=Math.max(3,bw-4), h=y(0)-y(d.sc), r=Math.min(4,w/2);
    s+=`<path d="M${x+2},${y(0)} v${-(h-r)} q0,${-r} ${r},${-r} h${w-2*r} q${r},0 ${r},${r} v${h-r} z" fill="${d.pl==='1st'?'var(--accent)':'var(--faint)'}" />`;
    s+=`<rect class="hit" x="${x}" y="${T}" width="${bw}" height="${H-T-B}" fill="transparent" data-i="${i}"/>`;
    if(i%every===0) s+=`<text x="${x+bw/2}" y="${H-B+14}" text-anchor="middle">${esc(d.id)}</text>`;
  });
  s+=`<line x1="${L}" x2="${W-R}" y1="${y(avg)}" y2="${y(avg)}" stroke="var(--fg)" stroke-width="1.5" stroke-dasharray="4 4"/><text x="${W-R}" y="${y(avg)-5}" text-anchor="end" style="fill:var(--fg);font-weight:700">Average WR ${pct(avg)}</text>`;
  return s+'</svg><div class="tip" hidden></div>';
}
function viewResumo(){

  const podium=(arr,borrow)=>arr.length?`<div class="podium">${arr.map(([k,n],i)=>{const c=CARD.get(k);return `<div class="pc ${borrow?'borrow':''}"><div class="art">${cardImg(k)}<span class="rk">${i+1}</span><span class="ct num">${n}×</span></div><div class="nm">${esc(c?c.n:k.split('\n')[0])}${c?`<small>${esc(c.t)}</small>`:''}</div></div>`}).join('')}</div>`:'<p class="empty">Nada registrado ainda.</p>';
  $('#app').innerHTML=`
  ${importBanner()}
  ${currentHero()}
  ${empty?`<div class="banner"><p>Nenhum resultado registrado ainda. Abra um PvP, monte seu time e marque a colocação para ver as estatísticas aqui.</p><a class="btn primary" href="#cms">Ver PvPs</a></div>`:''}
  <section class="hero">
    <div class="panel perf">
      <div class="label">Placed · Win rate</div>
      <div class="wr"><b class="num">${pct(s.wr)}</b><span>${s.pl['1st']} 1st / ${s.tot} finals</span></div>
      <div class="medals">${PLACES.map(p=>`<div class="medal"><b class="num">${s.pl[p]}</b><span class="chip ${plClass(p)}">${p}</span></div>`).join('')}</div>
      <div class="facts">
        <div><span class="label">Average WR</span><b class="num">${s.scores.length?pct(s.avg):'–'}</b></div>
        <div><span class="label">Best WR</span><b class="num">${s.best?pct(s.best.sc):'–'}</b>${s.best?`<a href="#cm-${esc(s.best.id)}">${esc(s.best.id)}</a>`:''}</div>
        <div><span class="label">Worst WR</span><b class="num">${s.worst?pct(s.worst.sc):'–'}</b>${s.worst?`<a href="#cm-${esc(s.worst.id)}">${esc(s.worst.id)}</a>`:''}</div>
      </div>
    </div>
    <div class="panel"><div class="label">WR by PvP <span style="text-transform:none;letter-spacing:0;font-weight:500">· verde = 1st</span></div>
      <div class="chart" id="chart" style="margin-top:12px">${scoreChart(s.scores,s.avg)}</div>
    </div>
  </section>
  <section class="row2">
    <div class="panel"><div class="label">Umas (Ace)</div>
      ${s.aces.length?`<div class="aces">${s.aces.map(([k,n])=>`<div class="ace"><span class="av">${charImg(k,true)}<b class="num">${n}</b></span><span>${esc(k)}</span></div>`).join('')}</div>`:'<p class="empty">Nada registrado ainda.</p>'}
    </div>
    <div class="panel"><div class="label">Style (Ace)</div>
      <div class="bars">${STYLES.map(st=>{const n=s.styles[st]||0;return `<div class="bar"><span>${st}</span><span class="t"><i style="width:${n/styleMax*100}%"></i></span><b class="num">${n}</b></div>`}).join('')}</div>
    </div>
  </section>
  <section class="panel"><div class="label">Most Used Cards</div>${podium(s.cards,false)}</section>
  <section class="panel"><div class="label" style="color:var(--pink)">Most Borrowed Cards</div>${podium(s.borrow,true)}</section>`;
  const ch=$('#chart'), tip=ch&&ch.querySelector('.tip');
  if(tip) ch.querySelectorAll('.hit').forEach(r=>{
    const d=s.scores[+r.dataset.i];
    const show=()=>{const box=ch.getBoundingClientRect(),rb=r.getBoundingClientRect();tip.hidden=false;tip.textContent=`${d.id} · ${pct(d.sc)}${d.pl?' · '+d.pl:''}`;tip.style.left=(rb.left-box.left+rb.width/2)+'px';tip.style.top=(rb.top-box.top+ (1-d.sc)*rb.height)+'px';};
    r.addEventListener('mouseenter',show);r.addEventListener('mouseleave',()=>tip.hidden=true);
    r.addEventListener('click',()=>location.hash='cm-'+d.id);
    r.style.cursor='pointer';
  });
  bindImport(); bindSchedule();
}

      <div><button type="button" class="rname" ${ro}>${t.n?esc(t.n):`<span style="color:var(--muted)">Uma ${k+1}</span>`}</button>
        <div class="fields">
          <label class="nolab"><select name="ro" ${ro} aria-label="Ace ou Debuffer">${ROLES.map(r=>`<option ${t.ro===r?'selected':''}>${r}</option>`).join('')}</select></label>
          <label class="nolab"><select name="st" ${ro} aria-label="Style"><option value="">Style —</option>${STYLES.map(s=>`<option ${t.st===s?'selected':''}>${s}</option>`).join('')}</select></label>
          <label>Wins<span class="wins"><input name="w" ${ro} type="number" min="0" max="80" inputmode="numeric" value="${t.w??''}" aria-label="Wins (de 80)"><span class="num wrp" style="color:var(--muted)">${t.w!=null?pct(t.w/80):''}</span></span></label>
        </div></div></div>
    <div class="lower">
      <div><div class="label">Parents</div>
        <div class="tree">
          <span class="apex">${t.n?charImg(t.n):'<span class="ph">?</span>'}</span>
          ${ps(0)}${ps(3)}
          ${ps(1)}${ps(2)}${ps(4)}${ps(5)}
        </div></div>
      <div><div class="label">Deck</div>
        <div class="deck">${t.d.map((c,j)=>slot(j===5?'borrow':'',c?cardImg(c):'',`data-d="${j}"`,`${j===5?'Borrowed card':'Card '+(j+1)}: ${c?c.replace('\n',' '):'empty'}`,j===5?'':'+',j===5?'<span class="tag">BORROW</span>':'')).join('')}</div></div>
    </div>
  </article>`;
}

/* ---------- seletor ---------- */
let pk=null; const pkState={q:'',rar:new Set(),ty:new Set()};
function openPicker(kind,current,onPick,title){
  pk={kind,onPick}; pkState.q=''; $('#pk-q').value=''; $('#pk-title').textContent=title;
  $('#pk-remove').hidden=!current;
  $('#pk-fil').innerHTML=kind==='card'?['SSR','SR'].map(r=>`<button type="button" class="tog" data-rar="${r}" aria-pressed="${pkState.rar.has(r)}">${r}</button>`).join('')+'<span style="width:8px"></span>'+TYPES.map(t=>`<button type="button" class="tog" data-ty="${t}" aria-pressed="${pkState.ty.has(t)}"><span class="ty" style="background:${typeVar(t)}"></span>${t}</button>`).join(''):'';
  $('#pk-fil').hidden=kind!=='card';
  $('#pk-fil').querySelectorAll('.tog').forEach(b=>b.addEventListener('click',()=>{const set=b.dataset.rar?pkState.rar:pkState.ty;const v=b.dataset.rar||b.dataset.ty;set.has(v)?set.delete(v):set.add(v);b.setAttribute('aria-pressed',set.has(v));renderPick();}));
  renderPick(); $('#picker').showModal(); $('#pk-q').focus();
}
function renderPick(){
  const q=pkState.q.toLowerCase(); const L=$('#pk-list');
  L.classList.toggle('cards',pk.kind==='card');
  let items;
  if(pk.kind==='char') items=CAT.chars.filter(c=>!q||c.n.toLowerCase().includes(q)).map(c=>`<button type="button" data-v="${esc(c.n)}"><span class="im">${charImg(c.n)}</span><span>${esc(c.n)}</span></button>`);
  else items=CAT.cards.filter(c=>(!q||(c.n+' '+c.t).toLowerCase().includes(q))&&(!pkState.rar.size||pkState.rar.has(c.r))&&(!pkState.ty.size||pkState.ty.has(c.ty)))
    .map(c=>`<button type="button" data-v="${esc(c.k)}"><span class="im">${cardImg(c.k)}</span><span><b>${esc(c.n)}</b><br><small>${esc(c.t)}</small><br><small><span class="ty" style="background:${typeVar(c.ty)}"></span>${esc(c.ty)} · ${esc(c.r)}</small></span></button>`);
  L.innerHTML=items.length?items.join(''):'<p class="empty">Nada encontrado com esse filtro.</p>';
  L.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{const f=pk.onPick;$('#picker').close();f(b.dataset.v);}));
}
$('#pk-q').addEventListener('input',e=>{pkState.q=e.target.value;renderPick();});
$('#pk-close').addEventListener('click',()=>$('#picker').close());
$('#pk-remove').addEventListener('click',()=>{const f=pk.onPick;$('#picker').close();f(null);});
$('#picker').addEventListener('click',e=>{if(e.target===$('#picker'))$('#picker').close();});

/* ---------- salvar ---------- */
const LSKEY='cmcomps:data:v1';
const status=(t,err)=>{const s=$('#status');s.textContent=t;s.classList.toggle('err',!!err);};
function save(id){
  if(!db||!uid||!canWrite){ status(!canWrite?'Somente leitura':'Sem conexão: as mudanças não estão sendo salvas',true); return; }
  status('Salvando…');
  clearTimeout(timers.get(id));
  timers.set(id,setTimeout(()=>flush(id),700));
}
const writing=new Map();
async function flush(id){
  timers.delete(id);
  const prev=writing.get(id)||Promise.resolve();
  const p=prev.then(async()=>{
    try{ localStorage.setItem(LSKEY,JSON.stringify(DATA)); if(!timers.size) status('Salvo neste navegador'); }
    catch(e){ status('Este navegador não deixou salvar. Use “Baixar backup” para não perder seus dados.',true); }
  });
  writing.set(id,p); await p;
}

/* ---------- importação (só o dono) ---------- */
function bindImport(){
  const b=$('#do-import'); if(!b) return;
  b.addEventListener('click',async()=>{
    b.disabled=true; b.textContent='Importando…';
    try{
      const seed=await (await fetch('seed.json')).json();
      const ids=Object.keys(seed); let n=0;
      for(const id of ids){ DATA[id]=seed[id]; await db.collection('data/users/'+uid).doc('cm_'+id).set(seed[id]); n++; b.textContent=`Importando… ${n}/${ids.length}`; }
      status('Planilha importada'); route();
    }catch(e){ b.disabled=false; b.textContent='Tentar de novo'; status('A importação parou no meio. Clique em “Tentar de novo”.',true); }
  });
}

/* ---------- backup ---------- */
$('#bk-down').addEventListener('click',()=>{
  const blob=new Blob([JSON.stringify({app:'cmcomps',v:1,saved:new Date().toISOString(),data:DATA},null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='cmcomps-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
});
$('#bk-file').addEventListener('change',async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try{
    const j=JSON.parse(await f.text()); const d=j&&j.app==='cmcomps'?j.data:null;
    if(!d||typeof d!=='object') throw 0;
    const n=Object.keys(d).length;
    if(Object.keys(DATA).length&&!confirm(`Carregar este backup (${n} PvPs)? Ele substitui o que está salvo neste navegador.`)) return;
    DATA=d; localStorage.setItem(LSKEY,JSON.stringify(DATA)); status(`Backup carregado: ${n} PvPs`); route();
  }catch(_){ status('Esse arquivo não é um backup do CM Comps.',true); }
});

/* ---------- início ---------- */
const HIST=[]; let lastHash=location.hash, skipPush=false;
$('#back').addEventListener('click',()=>{ if(HIST.length){ skipPush=true; location.hash=HIST.pop()||'resumo'; } else location.hash=location.hash.startsWith('#cm-')?'cms':'resumo'; });
window.addEventListener('hashchange',()=>{if(!skipPush&&lastHash!==location.hash)HIST.push(lastHash);skipPush=false;lastHash=location.hash;if($('#picker').open)$('#picker').close();window.scrollTo(0,0);route();});
route();
(()=>{
  CONF=JSON.parse(document.getElementById('cmconfig').textContent);
  try{ const raw=localStorage.getItem(LSKEY); if(raw) DATA=JSON.parse(raw)||{}; }
  catch(e){ status('Este navegador está bloqueando o salvamento (aba anônima?)',true); }
  db='local'; uid='local'; owner=false;
  status(Object.keys(DATA).length?'Salvo neste navegador':'Pronto');
  route();
})();
})();
</script>
